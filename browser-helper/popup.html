<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:14px system-ui,sans-serif;width:310px;background:#0c1521;color:#eef5fc;padding:14px;margin:0}h1{font-size:16px;margin:0 0 8px}p{color:#a8b8ca;font-size:12px;line-height:1.7}label{display:block;font-size:12px;color:#a8b8ca;margin:10px 0 4px}input{width:100%;box-sizing:border-box;background:#07101a;color:white;border:1px solid #38506a;border-radius:8px;padding:9px}button{width:100%;margin-top:11px;border:0;border-radius:8px;padding:10px;background:#51d6d1;color:#061718;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#result{margin-top:9px;word-break:break-word}</style></head><body><h1>ورود Firefox به FoxyforVPS</h1><p>ابتدا در پنل VPS کد جفت‌سازی بگیر، سپس این افزونه را روی صفحهٔ رسمی accounts.firefox.com باز کن. افزونه رمز عبور را نمی‌خواند؛ session token را فقط پس از کلیک خودت و یک بار به تونل SSH روی localhost می‌فرستد.</p><label for="pair">کد یک‌بارمصرف پنل (۱۰ دقیقه)</label><input id="pair" autocomplete="off" spellcheck="false" placeholder="کد جفت‌سازی را وارد کن"><button id="send">ارسال نشست مجاز Firefox</button><p id="result"></p><script src="popup.js"></script></body></html>
